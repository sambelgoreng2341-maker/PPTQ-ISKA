<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient for Outer Border and Elements -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE59F" />
      <stop offset="35%" stop-color="#E5BE65" />
      <stop offset="70%" stop-color="#C79632" />
      <stop offset="100%" stop-color="#F7DF94" />
    </linearGradient>

    <!-- Deep Emerald Green Gradient for Star Body -->
    <radialGradient id="emeraldGrad" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#126B3E" />
      <stop offset="60%" stop-color="#0A4D2B" />
      <stop offset="100%" stop-color="#06381E" />
    </radialGradient>

    <!-- Drop Shadow for Sacred Emblem Elements -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="palmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 
    ISLAMIC 8-POINTED STAR (RUB EL HIZB)
    Formed by 2 overlapping congruent squares with rounded vertices
  -->
  <g transform="translate(256, 256)">
    <!-- Outer Gold Base Star -->
    <!-- Square 1 (Diagonal / Rotated 45 deg) -->
    <rect x="-192" y="-192" width="384" height="384" rx="14" fill="url(#goldGrad)" transform="rotate(45)" filter="url(#subtleGlow)" />
    <!-- Square 2 (Orthogonal / Rotated 0 deg) -->
    <rect x="-192" y="-192" width="384" height="384" rx="14" fill="url(#goldGrad)" filter="url(#subtleGlow)" />

    <!-- Inset Emerald Star Body -->
    <!-- Square 1 (Diagonal) -->
    <rect x="-182" y="-182" width="364" height="364" rx="10" fill="url(#emeraldGrad)" transform="rotate(45)" />
    <!-- Square 2 (Orthogonal) -->
    <rect x="-182" y="-182" width="364" height="364" rx="10" fill="url(#emeraldGrad)" />

    <!-- Fine Inner Gold Filigree Trim -->
    <rect x="-173" y="-173" width="346" height="346" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85" transform="rotate(45)" />
    <rect x="-173" y="-173" width="346" height="346" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85" />
  </g>

  <!-- ========================================== -->
  <!-- UPPER ARABIC CALLIGRAPHY BANNER           -->
  <!-- ========================================== -->
  <g id="arabicCalligraphy" fill="url(#goldGrad)" stroke="url(#goldGrad)" stroke-width="0.3" filter="url(#palmGlow)">
    <!-- Stylized Traditional Calligraphy Arch: Al-Ma'had Al-Islami Li Tahfidh Al-Qur'an Al-Karim -->
    <!-- Curved Calligraphy Strokes along the dome of the star -->
    <path d="M 125 240 C 130 200, 165 145, 256 128 C 347 145, 382 200, 387 240 C 383 238, 380 230, 375 220 C 355 175, 310 148, 256 142 C 202 148, 157 175, 137 220 C 132 230, 129 238, 125 240 Z" opacity="0.12" fill="url(#goldGrad)" />
    
    <!-- Left Wing Arabic Calligraphy Glyphs -->
    <path d="M 136 242 C 138 232, 142 225, 149 220 C 153 226, 158 227, 163 221 C 160 216, 156 214, 151 214 C 158 202, 168 194, 179 188 C 177 184, 171 184, 168 188 C 160 195, 151 204, 145 215 C 143 211, 140 212, 138 215 C 135 224, 133 233, 136 242 Z" />
    <path d="M 154 200 C 158 195, 163 194, 168 198 C 169 193, 165 190, 160 190 C 156 190, 152 194, 154 200 Z" />
    <path d="M 172 186 C 178 180, 186 177, 194 175 C 196 179, 194 183, 189 184 C 183 185, 177 188, 172 186 Z" />
    <path d="M 183 174 C 187 165, 196 160, 207 158 C 206 163, 201 166, 196 167 C 192 172, 187 176, 183 174 Z" />
    <path d="M 203 158 C 210 152, 218 148, 228 147 C 228 151, 224 154, 219 155 C 213 157, 208 160, 203 158 Z" />

    <!-- Center Top Calligraphic Harakat & Crown (Ta'awwudh / Bismillah styling) -->
    <path d="M 235 146 C 242 142, 250 140, 256 139 C 262 140, 270 142, 277 146 C 275 149, 270 148, 266 146 C 260 144, 252 144, 246 146 C 242 148, 237 149, 235 146 Z" />
    <path d="M 248 133 C 252 129, 260 129, 264 133 C 260 135, 252 135, 248 133 Z" />
    <circle cx="256" cy="148" r="2.5" />
    <circle cx="242" cy="153" r="2.2" />
    <circle cx="270" cy="153" r="2.2" />

    <!-- Right Wing Arabic Calligraphy Glyphs -->
    <path d="M 284 147 C 294 148, 302 152, 309 158 C 304 160, 299 157, 293 155 C 288 154, 284 151, 284 147 Z" />
    <path d="M 305 158 C 316 160, 325 165, 329 174 C 325 176, 320 172, 316 167 C 311 166, 306 163, 305 158 Z" />
    <path d="M 322 175 C 330 177, 338 180, 344 186 C 339 188, 333 185, 327 184 C 322 183, 320 179, 322 175 Z" />
    <path d="M 338 188 C 349 194, 359 202, 367 214 C 361 212, 358 211, 355 215 C 349 204, 340 195, 332 188 C 335 184, 341 184, 338 188 Z" />
    <path d="M 363 220 C 370 225, 374 232, 376 242 C 379 233, 377 224, 374 215 C 372 212, 369 211, 367 215 C 361 227, 356 226, 363 220 Z" />

    <!-- Distinct Calligraphic Diacritics (Fathah, Dammah, Tashdid, Nuqot) -->
    <path d="M 148 238 L 157 232" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 175 212 L 184 205" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linecap="round" />
    <path d="M 215 178 L 225 172" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linecap="round" />
    <path d="M 288 172 L 298 178" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linecap="round" />
    <path d="M 328 205 L 337 212" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linecap="round" />
    <path d="M 355 232 L 364 238" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- ========================================== -->
  <!-- CENTRAL EMBLEM: DATE PALM TREE (POHON KURMA)-->
  <!-- ========================================== -->
  <g id="datePalmTree" transform="translate(288, 252)" filter="url(#subtleGlow)">
    <!-- Palm Trunk with Textured Rings -->
    <path d="M -3 72 C -4 48, -2 18, 2 -18 C 4 -18, 7 18, 5 72 Z" fill="url(#goldGrad)" />
    <!-- Trunk texture notches -->
    <line x1="-3" y1="58" x2="5" y2="58" stroke="#876214" stroke-width="1.8" />
    <line x1="-3" y1="44" x2="4" y2="44" stroke="#876214" stroke-width="1.8" />
    <line x1="-2" y1="30" x2="4" y2="30" stroke="#876214" stroke-width="1.8" />
    <line x1="-2" y1="16" x2="4" y2="16" stroke="#876214" stroke-width="1.8" />
    <line x1="-1" y1="2" x2="3" y2="2" stroke="#876214" stroke-width="1.8" />
    <line x1="0" y1="-10" x2="3" y2="-10" stroke="#876214" stroke-width="1.8" />

    <!-- Palm Fronds (Daun Pelepah Kurma) in Radiant Arch -->
    <!-- Center Top Fronds -->
    <path d="M 2 -18 C 3 -42, 6 -60, 2 -72 C -2 -60, 1 -42, 2 -18 Z" fill="url(#goldGrad)" />
    <path d="M 2 -18 C -6 -40, -14 -58, -22 -68 C -14 -54, -7 -36, 2 -18 Z" fill="url(#goldGrad)" />
    <path d="M 2 -18 C 10 -40, 18 -58, 26 -68 C 18 -54, 11 -36, 2 -18 Z" fill="url(#goldGrad)" />

    <!-- Left Spreading Fronds -->
    <path d="M 2 -18 C -18 -32, -38 -42, -54 -46 C -40 -34, -22 -24, 2 -18 Z" fill="url(#goldGrad)" />
    <path d="M 2 -18 C -24 -20, -48 -22, -66 -18 C -48 -14, -26 -12, 2 -18 Z" fill="url(#goldGrad)" />
    <path d="M 2 -18 C -22 -8, -44 -2, -58 10 C -44 4, -24 0, 2 -18 Z" fill="url(#goldGrad)" />

    <!-- Right Spreading Fronds -->
    <path d="M 2 -18 C 22 -32, 42 -42, 58 -46 C 44 -34, 26 -24, 2 -18 Z" fill="url(#goldGrad)" />
    <path d="M 2 -18 C 28 -20, 52 -22, 70 -18 C 52 -14, 30 -12, 2 -18 Z" fill="url(#goldGrad)" />
    <path d="M 2 -18 C 26 -8, 48 -2, 62 10 C 48 4, 28 0, 2 -18 Z" fill="url(#goldGrad)" />

    <!-- Date Clusters (Tandan Buah Kurma) -->
    <circle cx="-5" cy="-8" r="4.5" fill="#FCE59F" />
    <circle cx="-9" cy="-2" r="3.8" fill="#E5BE65" />
    <circle cx="9" cy="-8" r="4.5" fill="#FCE59F" />
    <circle cx="13" cy="-2" r="3.8" fill="#E5BE65" />
  </g>

  <!-- Ambient Golden Sparkle / Light behind Ka'bah -->
  <circle cx="260" cy="254" r="16" fill="#FCE59F" opacity="0.3" filter="url(#subtleGlow)" />
  <circle cx="260" cy="254" r="5" fill="#FFFFFF" opacity="0.75" />

  <!-- ========================================== -->
  <!-- CENTRAL EMBLEM: THE HOLY KA'BAH (AL-KA'BAH)-->
  <!-- ========================================== -->
  <g id="holyKaaba" transform="translate(186, 260)" filter="url(#subtleGlow)">
    <!-- Base Isometric Cube -->
    <!-- Front Face (Gold & Warm Shadow) -->
    <polygon points="0,22 56,8 56,82 0,98" fill="url(#goldGrad)" stroke="#A07418" stroke-width="1.5" />
    <!-- Roof / Top Face -->
    <polygon points="0,22 56,8 76,-2 20,8" fill="#FCE59F" stroke="#A07418" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="56,8 76,-2 76,70 56,82" fill="#C79632" stroke="#876214" stroke-width="1.5" />

    <!-- Kiswah Golden Band (Hizam Al-Ka'bah) across Upper Facade -->
    <polygon points="0,34 56,20 56,29 0,43" fill="#FFF2B8" stroke="#876214" stroke-width="0.8" />
    <polygon points="56,20 76,10 76,17 56,29" fill="#E5BE65" stroke="#876214" stroke-width="0.8" />

    <!-- Door of the Ka'bah (Bab Al-Ka'bah) in Pure Radiant Gold -->
    <rect x="32" y="32" width="16" height="34" rx="2" fill="#FFE899" stroke="#7A560D" stroke-width="1.2" transform="skewY(-14)" />
    <!-- Golden Door Lattice Details -->
    <line x1="40" y1="26" x2="40" y2="58" stroke="#9E7319" stroke-width="1" />
    <line x1="33" y1="36" x2="47" y2="33" stroke="#9E7319" stroke-width="0.8" />
    <line x1="33" y1="46" x2="47" y2="43" stroke="#9E7319" stroke-width="0.8" />

    <!-- Mizab ar-Rahmah (Golden Spout) on Top -->
    <polygon points="12,12 16,11 16,16 12,17" fill="#FFF" />
  </g>

  <!-- ========================================== -->
  <!-- FOUNDATION: OPEN HOLY QUR'AN ON REHAL STAND-->
  <!-- ========================================== -->
  <g id="openQuranAndRehal" transform="translate(256, 360)" filter="url(#subtleGlow)">
    <!-- X-SHAPED WOODEN REHAL (CROSS STAND) -->
    <!-- Left Leg Going Down-Right -->
    <path d="M -70 -6 L 70 38 L 56 46 L -84 2 Z" fill="#B38120" stroke="#78530B" stroke-width="1.5" />
    <!-- Right Leg Going Down-Left -->
    <path d="M 70 -6 L -70 38 L -56 46 L 84 2 Z" fill="url(#goldGrad)" stroke="#78530B" stroke-width="1.5" />
    <!-- Wooden Notch Center Join -->
    <polygon points="-8,18 8,18 0,26" fill="#6B4804" />

    <!-- OPEN PAGES OF THE HOLY QUR'AN -->
    <!-- Left Open Page with Curved Organic Spine -->
    <path d="M 0 -16 C -35 -30, -78 -30, -108 -18 C -112 -16, -114 -12, -112 -8 C -108 4, -72 6, 0 16 Z" fill="url(#goldGrad)" stroke="#78530B" stroke-width="1.8" />
    <path d="M -4 -12 C -35 -24, -72 -24, -102 -14 C -102 -10, -70 0, -4 10 Z" fill="#FFF6D1" opacity="0.95" />
    <!-- Subtle Scripture Lines on Left Page -->
    <line x1="-92" y1="-14" x2="-22" y2="-6" stroke="#9E7519" stroke-width="1.4" stroke-linecap="round" />
    <line x1="-90" y1="-8" x2="-20" y2="0" stroke="#9E7519" stroke-width="1.4" stroke-linecap="round" />
    <line x1="-86" y1="-2" x2="-18" y2="6" stroke="#9E7519" stroke-width="1.4" stroke-linecap="round" />

    <!-- Right Open Page with Symmetrical Curved Contour -->
    <path d="M 0 -16 C 35 -30, 78 -30, 108 -18 C 112 -16, 114 -12, 112 -8 C 108 4, 72 6, 0 16 Z" fill="url(#goldGrad)" stroke="#78530B" stroke-width="1.8" />
    <path d="M 4 -12 C 35 -24, 72 -24, 102 -14 C 102 -10, 70 0, 4 10 Z" fill="#FFF6D1" opacity="0.95" />
    <!-- Subtle Scripture Lines on Right Page -->
    <line x1="22" y1="-6" x2="92" y2="-14" stroke="#9E7519" stroke-width="1.4" stroke-linecap="round" />
    <line x1="20" y1="0" x2="90" y2="-8" stroke="#9E7519" stroke-width="1.4" stroke-linecap="round" />
    <line x1="18" y1="6" x2="86" y2="-2" stroke="#9E7519" stroke-width="1.4" stroke-linecap="round" />

    <!-- Center Binding / Bookmark Ribbon (Pembatas Al-Qur'an) -->
    <path d="M 0 -18 L 0 20 L -4 28 L 0 24 L 4 28 L 0 20 Z" fill="#0A4D2B" stroke="#E5BE65" stroke-width="1" />
  </g>
</svg>
